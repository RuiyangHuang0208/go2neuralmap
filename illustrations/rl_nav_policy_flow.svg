<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">RL Navigation Policy Model Flow</title>
  <desc id="desc">Data flow diagram for RL navigation policy using neural map tokens, condition features, cross attention encoder, actor head, critic head, and command scaling.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 32px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #182026; }
      .subtitle { font: 16px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .section { fill: #ffffff; stroke: #c9d4df; stroke-width: 1.5; rx: 12; }
      .section-title { font: 700 17px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #263238; }
      .box { fill: #ffffff; stroke: #7b8b9a; stroke-width: 1.5; rx: 8; }
      .box-blue { fill: #e8f2ff; stroke: #3b78c8; }
      .box-green { fill: #e9f7ef; stroke: #31945b; }
      .box-orange { fill: #fff1dd; stroke: #d9822b; }
      .box-purple { fill: #f0ebff; stroke: #7c5cc4; }
      .box-red { fill: #ffe8e8; stroke: #c94f4f; }
      .box-gray { fill: #eef2f5; stroke: #7b8b9a; }
      .label { font: 700 16px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .text { font: 14px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #263238; }
      .small { font: 12.5px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #44515d; }
      .mono { font: 13px "JetBrains Mono", Consolas, monospace; fill: #263238; }
      .arrow { stroke: #263238; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #607d8b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="860"/>
  <text x="640" y="46" text-anchor="middle" class="title">RL Navigation Policy 数据流与模型结构</text>
  <text x="640" y="74" text-anchor="middle" class="subtitle">utils/rl_nav_policy observation builder + rsl_rl ActorCriticRLNav</text>

  <rect x="40" y="110" width="360" height="255" class="section"/>
  <text x="60" y="140" class="section-title">1. Observation Builder</text>

  <rect x="70" y="165" width="145" height="58" class="box box-blue"/>
  <text x="142.5" y="190" text-anchor="middle" class="label">Neural Map</text>
  <text x="142.5" y="211" text-anchor="middle" class="small">maps + uncertainties</text>

  <rect x="240" y="165" width="130" height="58" class="box box-green"/>
  <text x="305" y="190" text-anchor="middle" class="label">Robot State</text>
  <text x="305" y="211" text-anchor="middle" class="small">pose, vel, command</text>

  <rect x="155" y="252" width="150" height="70" class="box box-orange"/>
  <text x="230" y="278" text-anchor="middle" class="label">Goal XY</text>
  <text x="230" y="299" text-anchor="middle" class="small">target position</text>

  <path d="M142.5 223 L180 252" class="arrow-soft"/>
  <path d="M305 223 L274 252" class="arrow-soft"/>

  <rect x="455" y="105" width="360" height="265" class="section"/>
  <text x="475" y="135" class="section-title">2. Flat Observation Layout</text>

  <rect x="485" y="160" width="300" height="78" class="box box-blue"/>
  <text x="635" y="187" text-anchor="middle" class="label">map_tokens</text>
  <text x="635" y="209" text-anchor="middle" class="mono">[B, crop_size², token_dim]</text>
  <text x="635" y="226" text-anchor="middle" class="small">latent + uncertainty + geometry</text>

  <rect x="485" y="268" width="300" height="72" class="box box-green"/>
  <text x="635" y="294" text-anchor="middle" class="label">condition</text>
  <text x="635" y="316" text-anchor="middle" class="mono">[B, condition_dim]</text>
  <text x="635" y="333" text-anchor="middle" class="small">goal direction + state + previous command</text>

  <path d="M400 237 C423 237 430 199 455 199" class="arrow"/>
  <path d="M400 290 C423 290 430 304 455 304" class="arrow"/>

  <rect x="870" y="100" width="360" height="275" class="section"/>
  <text x="890" y="130" class="section-title">Token / Condition Dimensions</text>

  <rect x="900" y="155" width="300" height="82" class="box box-gray"/>
  <text x="1050" y="182" text-anchor="middle" class="label">token_dim</text>
  <text x="1050" y="205" text-anchor="middle" class="mono">num_dirs * latent_dim + num_dirs + 6</text>
  <text x="1050" y="223" text-anchor="middle" class="small">6 = rel_robot(2) + dist_robot(1) + rel_goal(2) + dist_goal(1)</text>

  <rect x="900" y="265" width="300" height="82" class="box box-gray"/>
  <text x="1050" y="292" text-anchor="middle" class="label">condition_dim</text>
  <text x="1050" y="315" text-anchor="middle" class="mono">3 + 8 + 3 = 14</text>
  <text x="1050" y="333" text-anchor="middle" class="small">default include_previous_command=True</text>

  <rect x="70" y="430" width="1140" height="335" class="section"/>
  <text x="90" y="462" class="section-title">3. ActorCriticRLNav</text>

  <rect x="110" y="505" width="185" height="85" class="box box-gray"/>
  <text x="202.5" y="532" text-anchor="middle" class="label">Flat obs</text>
  <text x="202.5" y="555" text-anchor="middle" class="mono">[B, N*T + C]</text>
  <text x="202.5" y="573" text-anchor="middle" class="small">N=crop_size²</text>

  <rect x="350" y="485" width="210" height="125" class="box box-purple"/>
  <text x="455" y="512" text-anchor="middle" class="label">split_observation</text>
  <text x="455" y="537" text-anchor="middle" class="mono">tokens: [B, N, T]</text>
  <text x="455" y="558" text-anchor="middle" class="mono">condition: [B, C]</text>
  <text x="455" y="581" text-anchor="middle" class="small">T=token_dim, C=condition_dim</text>

  <path d="M295 547.5 L350 547.5" class="arrow"/>

  <rect x="625" y="465" width="245" height="165" class="box box-blue"/>
  <text x="747.5" y="493" text-anchor="middle" class="label">RLNavMapEncoder</text>
  <text x="747.5" y="520" text-anchor="middle" class="small">token_proj MLP</text>
  <text x="747.5" y="542" text-anchor="middle" class="small">condition_proj MLP</text>
  <text x="747.5" y="564" text-anchor="middle" class="small">condition as query</text>
  <text x="747.5" y="586" text-anchor="middle" class="small">MultiheadAttention over tokens</text>
  <text x="747.5" y="611" text-anchor="middle" class="mono">output: [B, 3*embed_dim]</text>

  <path d="M560 547.5 L625 547.5" class="arrow"/>

  <rect x="945" y="440" width="205" height="92" class="box box-orange"/>
  <text x="1047.5" y="468" text-anchor="middle" class="label">Actor MLP</text>
  <text x="1047.5" y="492" text-anchor="middle" class="mono">[B, 3]</text>
  <text x="1047.5" y="511" text-anchor="middle" class="small">action mean / sampled action</text>

  <rect x="945" y="590" width="205" height="82" class="box box-green"/>
  <text x="1047.5" y="618" text-anchor="middle" class="label">Critic MLP</text>
  <text x="1047.5" y="642" text-anchor="middle" class="mono">[B, 1]</text>
  <text x="1047.5" y="660" text-anchor="middle" class="small">state value</text>

  <path d="M870 527 C902 527 912 486 945 486" class="arrow"/>
  <path d="M870 568 C902 568 912 631 945 631" class="arrow"/>

  <rect x="890" y="715" width="265" height="64" class="box box-red"/>
  <text x="1022.5" y="740" text-anchor="middle" class="label">scale_rl_nav_actions</text>
  <text x="1022.5" y="762" text-anchor="middle" class="small">vx, vy, yaw_rate command for low-level locomotion</text>

  <path d="M1047.5 532 L1047.5 715" class="arrow dash"/>

  <rect x="110" y="650" width="360" height="85" class="box box-gray"/>
  <text x="290" y="678" text-anchor="middle" class="label">Default Model Hyperparameters</text>
  <text x="290" y="702" text-anchor="middle" class="mono">embed_dim=128, heads=4</text>
  <text x="290" y="722" text-anchor="middle" class="mono">encoder MLP: token/condition -> 256 -> 128</text>

  <text x="640" y="815" text-anchor="middle" class="subtitle">Actor and critic use separate encoders with the same architecture; critic observations are expected to match actor observations.</text>
</svg>
