# @package algorithm
name: "guided_joint_ddpm"
config:
  num_diffusion_steps: 100
  beta_start: 1.0e-4
  beta_end: 0.02
  sample_eval_batches: false
  ema_tau: 0.005
  sampling_steps: 16
  candidate_steps: [4, 8, 12, 16]
  ddpm_candidate_count: 4
  perturbation_count: 5
  candidate_sampler:
    dataset_prob: 0.2
    perturbation_prob: 0.6
    ddpm_prob: 0.2
    candidates_per_sample: 1
  inference:
    sampling_steps: 16
  lambda_risk:
    start_step: 3000
    warmup_steps: 30000
    max_value: 0.1
  collision_checker:
    velocity_scale: ${training.dataset.velocity_scale}
    obstacle_threshold: 70.0
    robot_radius_cells: 1
    interpolation_step_cells: 0.5
  perturbation:
    velocity_noise_std: 0.15
    heading_noise_std: 0.25
    speed_scale_low: 0.5
    speed_scale_high: 1.4
    lateral_bias_std: 0.2
  risk_classifier:
    condition_dim: 256
    horizon: 10
    command_dim: 4
    hidden_dims: [256, 256]
  model:
    horizon: 10
    command_dim: 4
    timestep_dim: 64
    hidden_dims: [512, 512, 512]
    encoder:
      crop_size: ${training.dataset.crop_size}
      latent_dim: 64
      map_channels: 260
      cnn_channels: [64, 128]
      vector_hidden_dims: [256, 256]
      output_dim: 256
