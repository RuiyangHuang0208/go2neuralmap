# @package _global_
#
defaults:
  - _self_

log_dir: "logs/rollout/${curr_log_dir_name}"
env:
  terrain:
    # terrains_yaml: resources/terrains/configs/demo_plane.yaml
    terrains_yaml: resources/terrains/configs/demo_plane_closed_mirrored.yaml
    # terrains_yaml: resources/terrains/configs/plane.yaml
    # terrains_yaml: resources/terrains/configs/d1/d1_demo_plane_closed.yaml
  cost:
    visualize_collision_contacts: True
  init_state:
    rot: [0., 0., 1., 0.]
    # rot: [0., 0., 0., 1.]



helpers:
  state_recorder:
    config:
      interactive_mode  : False
      sampling_interval : 5
      replot_decimation : 5
      sub_plotters      : ["foot_print", "cost_map"]
      sub_recorders     : ["trajectory_recorder", "navigation_metrics_recorder",  "navigation_metrics_recorder"]
      log_dir           : ${log_dir}
  dataset_collector:
    enabled: false

modules:
  neural_map:
    name: "directional_bayesian_neural_map"
    config:
      # load_dir: logs/2026-05-06_99ca767/demo_plane_real_path_dataset_09-34-24/final_snapshot/neural_map
      # load_dir: logs/2026-05-07_3f2a519/demo_plane_real_path_dataset_5env_08-23-58/final_snapshot/neural_map
      x_range              : [-2.0, 10.0]
      y_range              : [-2.0, 10.0]
      least_count          : 0.25
      initial_uncertainty  : 100000.0
      incoming_uncertainty : 10.0
      aging_rate           : 0.1
      max_uncertainty      : 100000.0
      min_velocity_norm    : 0.001
      min_channel_weight   : 0.000001

  planner:
    name: "edge_cost_astar"
    config:
      heuristic: "l2_dist"
      heuristic_min_step_cost: 0.0
      obstacle_threshold: 70.0
      waypoint_stride: 5

  cost_map:
    name: "collision_directional_ema_velocity_cost_map"
    config:
      # load_dir: logs/2026-05-06_99ca767/demo_plane_real_path_dataset_09-34-24/final_snapshot/cost_map
      # load_dir: logs/2026-05-07_3f2a519/demo_plane_real_path_dataset_5env_08-23-58/final_snapshot/cost_map
      init_value: 45
      least_count: ${modules.neural_map.config.least_count}
      alpha: 0.1
      stuck_threshold_steps: 200
      min_velocity_norm: 0.001
      min_command_norm: 0.001
      impassable_cost: 1000000.0

  cost_estimator:
    name: "estimate_from_critic"
    config:
      add_env_cost: True

  vel_command_generator:
    name: rl_nav_policy
    config:
      # run_dir: logs/rl_nav_policy/2026-05-24_04-34-46_stage3
      run_dir: logs/rl_nav_policy/2026-05-23_06-22-39_stage3
      # run_dir: logs/rl_nav_policy/2026-05-26_04-40-17_stage3
      checkpoint: null
      device: cuda
      resample_goal_flag: true
      reset_env_flag: true
      goal_source: sampled
      visualize_attention_weights: true
      attention_marker_min_radius: 0.015
      attention_marker_max_radius: 0.08
      attention_marker_height_offset: 0.08
      attention_marker_height_scale: 0.12

  position_controller:
    name: "position_controller_bezier"
    config:
      derivative_eval_u: 0.0
      tangent_scale: 0.1666666667
      min_tangent_norm: 0.001
      max_speed: 1.5
      max_lateral_speed: 0.5
