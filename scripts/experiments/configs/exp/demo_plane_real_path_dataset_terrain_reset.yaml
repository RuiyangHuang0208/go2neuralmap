# @package _global_
#
defaults:
  - demo_plane_real_path_dataset
  - _self_

helpers:
  dataset_collector:
    enabled                  : true
    name                     : real_path
    output_dir               : ${log_dir}/dataset
    sample_interval          : 1
    shard_size               : 2048
    dtype                    : float16
    env_id                   : 0
    velocity_horizon         : 10
    velocity_command_dt      : 0.5
    main_loop_hz             : 50.0
    drop_incomplete_horizon  : false
    max_path_length          : 256
    max_waypoints            : 64
    crop_size                : 8
    uncertainty_log_scale    : 12.0
    uncertainty_max          : 100000.0
  state_recorder:
    config:
      interactive_mode  : False
      sampling_interval : 5
      replot_decimation : 5
      sub_plotters      : []
      sub_recorders     : []
      log_dir           : ${log_dir}

env:
  terrain:
    terrains_yaml: resources/terrains/configs/d1.yaml
    # terrains_yaml: resources/terrains/configs/demo_plane.yaml
    num_rows: 3
    num_cols: 3
  cost:
    visualize_collision_contacts: True
  env:
    num_envs: 5

modules:
  vel_command_generator:
    config:
      terrain_reset_after_goal_count: 10
      terrain_reset_resample_goal: true
      reset_maps_on_terrain_reset: true
      resample_goal_flag : True
      reset_env_flag     : True
