# @package _global_
#
defaults:
  - _self_

env:
  terrain:
    terrains_yaml: resources/terrains/configs/demo_plane.yaml

helpers:
  state_recorder:
    config:
      interactive_mode  : False
      sampling_interval : 5
      replot_decimation : 5
      # sub_plotters      : ["foot_print", "cost_map"]
      sub_plotters      : ["foot_print"]
      sub_recorders     : ["trajectory_recorder"]
      log_dir           : ${log_dir}

modules:
  neural_map:
    config:
      least_count: 0.25
  planner:
    name: "edge_cost_astar"
    config:
      heuristic: "manhattan_dist"
      heuristic_min_step_cost: 0.0
      obstacle_threshold: 70.
      waypoint_stride: 3
  cost_map:
    name: "directional_ema_transition_cost_map"
    config:
      least_count: ${modules.neural_map.config.least_count}
      alpha: 0.1
  cost_estimator:
    name: "estimate_from_cost_pred_nn"
    config:
      nn_cfg:
       device: ${env.env.device}
       ckpt_path: "/home/liwei/F/002Project/2025W/MasterThesis/go2_neural_map/logs/cost_pred-2026-04-07_11-04-53/model_4500.pt"
  vel_command_generator:
    name: position_navigation
    config:
      map_least_count: ${modules.neural_map.config.least_count}
