# @package _global_
#
defaults:
  - demo_plane_7
  - _self_

env:
  terrain:
    terrains_yaml: resources/terrains/configs/demo_plane.yaml
  cost:
    visualize_collision_contacts: True

modules:
  neural_map:
    config:
      load_dir: logs/2026-05-06_99ca767/demo_plane_real_path_dataset_09-34-24/final_snapshot/neural_map

  cost_map:
    config:
      load_dir: logs/2026-05-06_99ca767/demo_plane_real_path_dataset_09-34-24/final_snapshot/cost_map
  vel_command_generator:
    name: position_navigation
    config:
      map_least_count: ${modules.neural_map.config.least_count}
      replan_interval: 50
      planning_failure_callback: backward_keep_heading_bypass_refiner
      planning_failure_backward_velocity: 0.6
      planning_failure_replan_interval: 20
      resample_goal_flag : False
      reset_env_flag     : False
helpers:
  dataset_collector:
    enabled                  : true
    name                     : real_path
    output_dir               : ${log_dir}/dataset
    sample_interval          : 1
    shard_size               : 2048
    dtype                    : float16
    env_id                   : 0
    velocity_horizon         : 10
    velocity_command_dt      : 0.5
    main_loop_hz             : 50.0
    drop_incomplete_horizon  : false
    max_path_length          : 256
    max_waypoints            : 64
    crop_size                : 8
    uncertainty_log_scale    : 12.0
    uncertainty_max          : 100000.0
