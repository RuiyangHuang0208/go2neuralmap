# @package _global_
#
defaults:
  - _self_

env:
  terrain:
    # terrains_yaml: resources/terrains/configs/demo_plane.yaml
    terrains_yaml: resources/terrains/configs/plane.yaml
    # terrains_yaml: resources/terrains/configs/d1/d1_plane.yaml
  cost:
    visualize_collision_contacts: True
  init_state:
    # rot: [0., 0., 1., 0.]
    rot: [0., 0., 0., 1.]



helpers:
  state_recorder:
    config:
      interactive_mode  : False
      sampling_interval : 5
      replot_decimation : 5
      sub_plotters      : ["foot_print", "cost_map"]
      sub_recorders     : ["trajectory_recorder"]
      log_dir           : ${log_dir}
  dataset_collector:
    enabled: false

modules:
  neural_map:
    name: "directional_bayesian_neural_map"
    config:
      # load_dir: logs/2026-05-06_99ca767/demo_plane_real_path_dataset_09-34-24/final_snapshot/neural_map
      # load_dir: logs/2026-05-07_3f2a519/demo_plane_real_path_dataset_5env_08-23-58/final_snapshot/neural_map
      x_range              : [-2.0, 10.0]
      y_range              : [-2.0, 10.0]
      least_count          : 0.25
      initial_uncertainty  : 100000.0
      incoming_uncertainty : 10.0
      aging_rate           : 0.1
      max_uncertainty      : 100000.0
      min_velocity_norm    : 0.001
      min_channel_weight   : 0.000001

  planner:
    name: "edge_cost_astar"
    config:
      heuristic: "l2_dist"
      heuristic_min_step_cost: 0.0
      obstacle_threshold: 70.0
      waypoint_stride: 5

  cost_map:
    name: "collision_directional_ema_velocity_cost_map"
    config:
      # load_dir: logs/2026-05-06_99ca767/demo_plane_real_path_dataset_09-34-24/final_snapshot/cost_map
      # load_dir: logs/2026-05-07_3f2a519/demo_plane_real_path_dataset_5env_08-23-58/final_snapshot/cost_map
      init_value: 45
      least_count: ${modules.neural_map.config.least_count}
      alpha: 0.1
      stuck_threshold_steps: 200
      min_velocity_norm: 0.001
      min_command_norm: 0.001
      impassable_cost: 1000000.0

  cost_estimator:
    name: "estimate_from_critic"
    config:
      add_env_cost: True

  vel_command_generator:
    name: diffusion_policy
    config:
      # run_dir: "logs/diffusion_policy/ddpm_2026-05-06_11-00-07"
      # run_dir: "logs/diffusion_policy/ddpm_2026-05-06_18-02-59"
      # run_dir: "logs/diffusion_policy/cfg_ddpm_2026-05-07_10-40-14"
      # run_dir: "logs/diffusion_policy/guided_joint_ddpm_2026-05-08_12-40-23"
      # run_dir: "logs/diffusion_policy/cfg_ddpm_2026-05-11_22-27-03"
      # run_dir: "logs/diffusion_policy/cfg_ddpm_2026-05-14_12-29-28"
      # run_dir: "logs/diffusion_policy/cfg_ddpm_2026-05-14_15-58-34"
      # run_dir: "logs/diffusion_policy/cfg_ddpm_2026-05-15_08-48-25"
      # run_dir: "logs/diffusion_policy/cfg_ddpm_2026-05-18_23-06-03"
      run_dir: "logs/diffusion_policy/cfg_ddpm_2026-05-19_09-19-30"
      checkpoint: "${.run_dir}/latest.pt"
      config: "${.run_dir}/config.yaml"
      device: ${env.env.device}
      execution_horizon: 5
      command_dt: 0.5
      main_loop_hz: 50.0
      # goal_tolerance: 0.35
      goal_tolerance: 1.
      resample_goal_flag: True
      reset_env_flag: False
      goal_source: "sampled"
      visualize_prediction_path: True
      prediction_marker_radius: 0.06
      prediction_marker_height_offset: 0.08

  position_controller:
    name: "position_controller_bezier"
    config:
      derivative_eval_u: 0.0
      tangent_scale: 0.1666666667
      min_tangent_norm: 0.001
      max_speed: 1.5
      max_lateral_speed: 0.5
