# @package _global_
#
defaults:
  - _self_

env:
  env:
    num_envs: 512
    device: cuda
  commands:
    heading_command: false
    resampling_time: 1000000000.0
  cost:
    visualize_collision_contacts: false
  terrain:
    num_rows: 1
    num_cols: 2
    terrains_yaml: resources/terrains/configs/rl_nav/stage1.yaml

training:
  seed: 0
  device: cuda
  max_iterations: 3000
  output_dir: "logs/rl_nav_policy/${run_timestamp}_stage1"

rl_nav:
  # command_dt: 0.5
  command_dt: 0.25
  main_loop_hz: 50.0
  max_episode_steps: 80
  collision_done_threshold: null
  map_reset_success_threshold: 5
  resample_task_on_timeout: true
  resample_task_on_collision_done: true
  disable_low_level_command_resampling: true
  terminate_on_map_out_of_bounds: true
  profiling_enabled: true
  goal_sampling:
    min_distance: 0.0
    max_distance: 3.0
    max_attempts: 20
    fallback: accept_last
  terrain_resampling:
    on_task_success: false
    on_map_reset: true
    on_timeout: false
    on_collision_done: false

ppo:
  runner:
    logger: wandb
    wandb_project: go2_neural_map_rl_nav
    wandb_run_name: ${run_timestamp}_stage1
    wandb_entity: null
    wandb_mode: null
