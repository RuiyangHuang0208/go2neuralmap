# @package _global_
#
defaults:
  - _self_

env:
  env:
    num_envs: 512
    device: cuda
  commands:
    heading_command: false
    resampling_time: 1000000000.0
  cost:
    visualize_collision_contacts: false
  terrain:
    num_rows: 3
    num_cols: 3
    terrains_yaml: resources/terrains/configs/rl_nav/stage2.yaml

training:
  seed: 0
  device: cuda
  max_iterations: 3000
  output_dir: "logs/rl_nav_policy/${run_timestamp}_cellwise_v3_stage2"

modules:
  neural_map:
    name: cellwise_bayesian_neural_map
    num_envs: ${env.env.num_envs}
    config:
      x_range: [-2.0, 10.0]
      y_range: [-2.0, 10.0]
      device: ${env.env.device}
      short_latent_dim: 32
      long_latent_dim: 32
      least_count: 0.25
      initial_uncertainty: 100000.0
      incoming_uncertainty: 10.0
      aging_rate: 0.1
      max_uncertainty: 100000.0

rl_nav:
  observation:
    crop_size: 8
    include_global_map: true
    global_pool_size: 12
  # command_dt: 0.5
  command_dt: 0.25
  main_loop_hz: 50.0
  max_episode_steps: 160
  collision_done_threshold: null
  map_reset_success_threshold: 5
  resample_task_on_timeout: true
  resample_task_on_collision_done: true
  disable_low_level_command_resampling: true
  terminate_on_map_out_of_bounds: true
  profiling_enabled: false
  goal_sampling:
    min_distance: 0.0
    max_distance: 6.
    max_attempts: 20
    fallback: accept_last
  terrain_resampling:
    on_task_success: false
    on_map_reset: true
    on_timeout: false
    on_collision_done: false

ppo:
  runner:
    logger: wandb
    wandb_project: go2_neural_map_rl_nav
    wandb_run_name: ${run_timestamp}_cellwise_v3_stage2
    wandb_entity: null
    wandb_mode: null
    policy_class_name: ActorCriticRLNavV3
  policy:
    token_dim: 71
    local_crop_size: ${rl_nav.observation.crop_size}
    global_pool_size: ${rl_nav.observation.global_pool_size}
    local_crop_encoder_hidden_dims: [256]
    global_encoder_hidden_dims: [256]
    query_hidden_dims: [256]
