# @package _global_
#
# Evaluation-focused variant of demo_plane_8 using the shared navigation task
# evaluator for position_navigation.
defaults:
  - _self_
log_dir: "logs/rollout/${curr_log_dir_name}"

env:
  terrain:
    # terrains_yaml: resources/terrains/configs/d1/d1_demo_plane_closed.yaml
    # terrains_yaml: resources/terrains/configs/demo_plane.yaml
    # terrains_yaml: resources/terrains/configs/demo_plane_closed_mirrored.yaml
    # terrains_yaml: resources/terrains/configs/test.yaml
    # terrains_yaml: resources/terrains/configs/rl_nav/experiment/001_m.yaml
    # terrains_yaml: resources/terrains/configs/rl_nav/experiment/005.yaml
    terrains_yaml: resources/terrains/configs/rl_nav/experiment/001.yaml
    # terrains_yaml: resources/terrains/configs/rl_nav/experiment/d1_demo_plane_closed_m.yaml
    # terrains_yaml: resources/terrains/configs/rl_nav/experiment/d1_demo_plane_closed.yaml
  cost:
    visualize_collision_contacts: True

helpers:
  state_recorder:
    config:
      interactive_mode  : False
      sampling_interval : 5
      replot_decimation : 5
      sub_plotters      : ["foot_print", "cost_map"]
      sub_recorders     : ["trajectory_recorder", "navigation_metrics_recorder"]
      log_dir           : ${log_dir}
  dataset_collector:
    enabled         : false
    output_dir      : ${log_dir}/dataset
    sample_interval : 1
    shard_size      : 256
    dtype           : float32
    env_id          : 0

modules:
  neural_map:
    name: "directional_bayesian_neural_map"
    config:
      x_range              : [-2.0, 10.0]
      y_range              : [-2.0, 10.0]
      least_count          : 0.25
      initial_uncertainty  : 100000.0
      incoming_uncertainty : 10.0
      aging_rate           : 0.1
      max_uncertainty      : 100000.0
      min_velocity_norm    : 0.001
      min_channel_weight   : 0.000001

  planner:
    name: "edge_cost_astar"
    config:
      heuristic: "l2_dist"
      heuristic_min_step_cost: 0.0
      obstacle_threshold: 70.0
      waypoint_stride: 5

  cost_map:
    name: "collision_directional_ema_velocity_cost_map"
    config:
      init_value: 45
      least_count: ${modules.neural_map.config.least_count}
      alpha: 0.1
      stuck_threshold_steps: 200
      min_velocity_norm: 0.001
      min_command_norm: 0.001
      impassable_cost: 1000000.0

  cost_estimator:
    name: "estimate_from_critic"
    #  name: "estimate_from_cost_pred_nn"
    config:
      add_env_cost: True
      ckpt_path: resources/critic_weights.pt
      # nn_cfg:
      #   ckpt_path: logs/cost_pred-2026-04-07_11-04-53/model_4500.pt

  vel_command_generator:
    name: position_navigation
    config:
      map_least_count: ${modules.neural_map.config.least_count}
      replan_interval: 50 # Low level steps
      goal_source: list
      goal_list_start_index: 0
      goal_xy_list:
        - [1.0, 4.0]
        - [7.0, 4.0]
      goal_tolerance: 0.35
      waypoint_tolerance: 0.25
      timeout_limit_s: 30.0
      timeout_limit_steps: null
      timeout_action: env_reset
      advance_goal_on_success: true
      advance_goal_on_timeout: false
      advance_goal_on_done: true
      reset_env_flag: false

  position_controller:
    name: "position_controller_bezier"
    config:
      derivative_eval_u: 0.0
      tangent_scale: 0.1666666667
      min_tangent_norm: 0.001
      max_speed: 1.5
      max_lateral_speed: 0.5
    # name: position_controller_polynomial_time
    # config:
    #   fit_point_count      : 5
    #   poly_degree          : 3
    #   reference_speed      : 0.6
    #   derivative_eval_time : 0.0
    #   min_time_horizon     : 1e-3
    #   max_speed            : 1.0
    #   max_lateral_speed    : 0.5

