# @package _global_
#
# Evaluation-focused variant of rl_nav_3 with explicit task timeout and
# shared navigation task logging.
defaults:
  - _self_

log_dir: "logs/rollout/${curr_log_dir_name}"
env:
  terrain:
    # terrains_yaml: resources/terrains/configs/demo_plane.yaml
    # terrains_yaml: resources/terrains/configs/demo_plane_closed_mirrored.yaml
    # terrains_yaml: resources/terrains/configs/d1_test_scene.yaml
    # terrains_yaml: resources/terrains/configs/d1_test_scene_4.yaml
    # terrains_yaml: resources/terrains/configs/d1/d1_simple_maze.yaml
    # terrains_yaml: resources/terrains/configs/plane.yaml
    # terrains_yaml: resources/terrains/configs/d1/d1_demo_plane_closed.yaml
    # terrains_yaml: resources/terrains/configs/test.yaml
    terrains_yaml: resources/terrains/configs/rl_nav/experiment/001_m.yaml
  cost:
    visualize_collision_contacts: True
  init_state:
    rot: [0., 0., 1., 0.]
    # rot: [0., 0., 0., 1.]



helpers:
  state_recorder:
    config:
      interactive_mode  : False
      sampling_interval : 5
      replot_decimation : 5
      sub_plotters      : ["foot_print", "cost_map"]
      sub_recorders     : ["trajectory_recorder", "navigation_metrics_recorder"]
      log_dir           : ${log_dir}
  dataset_collector:
    enabled: false

modules:
  neural_map:
    name: "directional_bayesian_neural_map"
    config:
      # load_dir: logs/2026-05-06_99ca767/demo_plane_real_path_dataset_09-34-24/final_snapshot/neural_map
      # load_dir: logs/2026-05-07_3f2a519/demo_plane_real_path_dataset_5env_08-23-58/final_snapshot/neural_map
      # load_dir: logs/rollout/2026-05-30_6df4411/rl_nav_3_11-54-01/final_snapshot/neural_map
      x_range              : [-2.0, 10.0]
      y_range              : [-2.0, 10.0]
      least_count          : 0.25
      initial_uncertainty  : 100000.0
      incoming_uncertainty : 10.0
      aging_rate           : 0.1
      # aging_rate           : 0.0
      max_uncertainty      : 100000.0
      min_velocity_norm    : 0.001
      min_channel_weight   : 0.000001

  planner:
    name: "edge_cost_astar"
    config:
      heuristic: "l2_dist"
      heuristic_min_step_cost: 0.0
      obstacle_threshold: 70.0
      waypoint_stride: 5

  cost_map:
    name: "collision_directional_ema_velocity_cost_map"
    config:
      # load_dir: logs/2026-05-06_99ca767/demo_plane_real_path_dataset_09-34-24/final_snapshot/cost_map
      # load_dir: logs/2026-05-07_3f2a519/demo_plane_real_path_dataset_5env_08-23-58/final_snapshot/cost_map
      init_value: 45
      least_count: ${modules.neural_map.config.least_count}
      alpha: 0.1
      stuck_threshold_steps: 200
      min_velocity_norm: 0.001
      min_command_norm: 0.001
      impassable_cost: 1000000.0

  cost_estimator:
    name: "estimate_from_critic"
    config:
      add_env_cost: True

  vel_command_generator:
    name: rl_nav_policy
    config:
      # run_dir: logs/rl_nav_policy/2026-05-24_04-34-46_stage3
      # run_dir: logs/rl_nav_policy/2026-05-23_06-22-39_stage3
      # run_dir: logs/rl_nav_policy/2026-05-26_04-40-17_stage3
      # run_dir: logs/rl_nav_policy/2026-05-27_16-18-38_stage3
      # run_dir: logs/rl_nav_policy/2026-05-29_19-43-20_v3_stage4
      # run_dir: logs/rl_nav_policy/2026-05-31_01-09-29_v3_stage4
      # run_dir: logs/rl_nav_policy/2026-05-31_22-55-45_v3_stage3_nm_enhancement
      # run_dir: logs/rl_nav_policy/2026-06-01_14-06-34_v3_stage3_nm_enhancement
      # run_dir: logs/rl_nav_policy/2026-06-02_16-07-12_v3_stage3_nm_enhancement # < Current best
      run_dir: logs/rl_nav_policy/2026-06-03_05-00-24_v3_stage3_nm_enhancement # < Maybe best
      checkpoint: null
      device: cuda
      resample_goal_flag: true
      reset_env_flag: false
      goal_source: list
      goal_list_start_index: 0
      goal_xy_list:
        - [1., 4.]
        - [7., 4.]
      # visualize_attention_weights: true
      visualize_attention_weights: false
      attention_marker_min_radius: 0.015
      attention_marker_max_radius: 0.08
      attention_marker_height_offset: 0.08
      attention_marker_height_scale: 0.12
      goal_tolerance: null # Not overriding policy read from training process
      timeout_limit_s: 30.0
      timeout_limit_steps: null
      timeout_action: task_reset
      advance_goal_on_success: true
      advance_goal_on_timeout: true
      advance_goal_on_done: true

  position_controller:
    name: "position_controller_bezier"
    config:
      derivative_eval_u: 0.0
      tangent_scale: 0.1666666667
      min_tangent_norm: 0.001
      max_speed: 1.5
      max_lateral_speed: 0.5

