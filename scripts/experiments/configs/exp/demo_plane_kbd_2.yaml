defaults:
  - _self_

env:
  terrain:
    # terrains_yaml: resources/terrains/configs/baseline_testground.yaml
    terrains_yaml: resources/terrains/configs/demo_plane.yaml
    

helpers:
  state_recorder:
    config:
      interactive_mode  : False
      sampling_interval : 5
      replot_decimation : 5
      # sub_plotters      : ["foot_print", "cost_map"]
      sub_plotters      : []
      sub_recorders     : ["cost_recorder"]
      log_dir           : ${log_dir}

modules:
  neural_map:
    config:
      least_count: 0.25
  cost_map:
    config:
      least_count: ${modules.neural_map.config.least_count}

  cost_estimator:
    name: "estimate_from_critic"
    config:
      # add_env_cost: True
      add_env_cost: False
