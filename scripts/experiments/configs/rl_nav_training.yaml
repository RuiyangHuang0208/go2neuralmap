# @package _global_
#
defaults:
  - envs/go2nm_demo
  - modules:
    - neural_map
    - locomotion_model
  - _self_

task: go2nm
run_timestamp: ???

training:
  seed: 0
  device: cuda
  max_iterations: 1000
  output_dir: "logs/rl_nav_policy/${run_timestamp}"

env:
  env:
    num_envs: 16
    device: cuda
  commands:
    heading_command: false
    resampling_time: 1000000000.0
  cost:
    visualize_collision_contacts: false
  terrain:
    num_rows: 4
    num_cols: 4
    terrains_yaml: resources/terrains/configs/d1.yaml

modules:
  neural_map:
    name: directional_bayesian_neural_map
    num_envs: ${env.env.num_envs}
    config:
      x_range: [-2.0, 10.0]
      y_range: [-2.0, 10.0]
      device: ${env.env.device}
      short_latent_dim: 32
      long_latent_dim: 32
      least_count: 0.25
      initial_uncertainty: 100000.0
      incoming_uncertainty: 10.0
      aging_rate: 0.1
      max_uncertainty: 100000.0

rl_nav:
  # command_dt: 0.5
  command_dt: 0.25
  main_loop_hz: 50.0
  max_episode_steps: 80
  collision_done_threshold: null
  map_reset_success_threshold: 5
  resample_task_on_timeout: true
  resample_task_on_collision_done: true
  disable_low_level_command_resampling: true
  terminate_on_map_out_of_bounds: true
  profiling_enabled: true
  debug_observation_nan: false
  goal_sampling:
    min_distance: 0.0
    max_distance: null
    max_attempts: 20
    fallback: accept_last
  terrain_resampling:
    on_task_success: false
    on_map_reset: false
    on_timeout: false
    on_collision_done: false
  observation:
    crop_size: 8
    goal_scale: 12.0
    velocity_scale: 1.5
    yaw_rate_scale: 1.0
    uncertainty_log_scale: 12.0
    uncertainty_max: 100000.0
    clipped_goal_distance: 1.0
    include_previous_command: true
  command:
    max_forward_speed: 1.5
    max_backward_speed: 0.5
    max_lateral_speed: 0.5
    max_yaw_rate: 1.0
    deadband: 0.0
  reward:
    variant: shaped
    goal_tolerance: 0.35
    reached_goal_reward: 10.0
    collision_penalty: 2.0
    termination_penalty: 10.0
    progress_scale: 2.0
    progress_positive_only: true
    time_penalty: 0.01
    command_penalty_scale: 0.01
    command_smoothness_penalty_scale: 0.02
    collision_uncertainty_scale:
      enabled: false
      scope: crop_mean
      min_scale: 0.75
      max_scale: 1.5
    repeated_collision_penalty:
      enabled: false
      penalty_scale: 1.0
      radius_cells: 1
      max_count: 3.0
      decay: 1.0

ppo:
  runner:
    policy_class_name: ActorCriticRLNav
    algorithm_class_name: PPO
    num_steps_per_env: 24
    save_interval: 100
    logger: wandb
    wandb_project: go2_neural_map_rl_nav
    wandb_run_name: ${run_timestamp}
    wandb_entity: null
    wandb_mode: null
  policy:
    crop_size: ${rl_nav.observation.crop_size}
    token_dim: 266
    condition_dim: 14
    encoder_embed_dim: 128
    encoder_heads: 4
    encoder_hidden_dims: [256]
    actor_hidden_dims: [256, 256]
    critic_hidden_dims: [256, 256]
    activation: elu
    init_noise_std: 1.0
    attention_dropout: 0.0
  algorithm:
    value_loss_coef: 1.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.01
    entropy_coef_schedule: fixed
    entropy_coef_final: 0.01
    entropy_coef_schedule_steps: 0
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 1.0e-3
    schedule: adaptive
    gamma: 0.99
    lam: 0.98
    desired_kl: 0.01
    max_grad_norm: 1.0
