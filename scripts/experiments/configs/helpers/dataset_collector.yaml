dataset_collector:
  enabled         : false
  name            : snapshot
  output_dir      : ${log_dir}/dataset
  sample_interval : 1
  shard_size      : 256
  dtype           : float16
  env_id          : 0
  velocity_horizon        : 10
  velocity_command_dt     : 0.5
  main_loop_hz            : 50.0
  drop_incomplete_horizon : false
  max_path_length         : 256
  max_waypoints           : 64
  crop_size               : 8
  uncertainty_log_scale   : 12.0
  uncertainty_max         : 100000.0
